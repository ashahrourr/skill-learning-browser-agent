<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet DOM Snake Gym</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5f6b7a;
      --line: #d8e0ea;
      --snake: #1e7a52;
      --head: #0d5f3d;
      --food: #c93434;
      --focus: #2259c7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 28px auto;
      display: grid;
      grid-template-columns: minmax(360px, 620px) minmax(280px, 1fr);
      gap: 24px;
      align-items: start;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(10, minmax(26px, 1fr));
      gap: 4px;
      margin-top: 18px;
    }

    .cell {
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #eef3f8;
      color: transparent;
      cursor: default;
      position: relative;
      min-width: 0;
    }

    .cell[data-state="snake"] {
      background: var(--snake);
      border-color: var(--snake);
    }

    .cell[data-state="head"] {
      background: var(--head);
      border-color: var(--head);
    }

    .cell[data-state="food"] {
      background: #fff1f1;
      border-color: var(--food);
    }

    .cell[data-state="food"]::after {
      content: "";
      position: absolute;
      inset: 24%;
      border-radius: 50%;
      background: var(--food);
    }

    .cell:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfdff;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .stat strong {
      font-size: 22px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 74px);
      grid-template-areas:
        ". up ."
        "left down right";
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }

    .controls button,
    .commands button {
      border: 1px solid #b9c6d6;
      background: #ffffff;
      color: var(--ink);
      border-radius: 8px;
      min-height: 46px;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }

    .controls button:hover,
    .commands button:hover {
      background: #edf4ff;
    }

    [data-direction="up"] { grid-area: up; }
    [data-direction="down"] { grid-area: down; }
    [data-direction="left"] { grid-area: left; }
    [data-direction="right"] { grid-area: right; }

    .commands {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #eef6ff;
      border: 1px solid #c7daf5;
      color: #163a68;
      margin-top: 14px;
      min-height: 48px;
    }

    .legend {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .legend div {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      display: inline-block;
      border: 1px solid var(--line);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="game-title">
      <h1 id="game-title">Pet DOM Snake Gym</h1>
      <p>Reach the food with visible UI controls. The board is real DOM, not canvas.</p>

      <div class="stats" aria-label="game stats">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Target</span><strong id="target-score">2</strong></div>
        <div class="stat"><span>Moves</span><strong id="moves">0</strong></div>
      </div>

      <div id="board" class="board" role="grid" aria-label="snake board"></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <aside class="panel" aria-labelledby="controls-title">
      <h1 id="controls-title">Controls</h1>
      <p>Use the buttons or keyboard arrows. The pet can inspect the visible state and click buttons.</p>

      <div class="controls" aria-label="movement controls">
        <button type="button" data-direction="up" aria-label="Move up">Up</button>
        <button type="button" data-direction="left" aria-label="Move left">Left</button>
        <button type="button" data-direction="down" aria-label="Move down">Down</button>
        <button type="button" data-direction="right" aria-label="Move right">Right</button>
      </div>

      <div class="commands">
        <button type="button" id="reset">Reset game</button>
        <button type="button" id="new-food">Move food</button>
      </div>

      <div class="legend" aria-label="legend">
        <div><span class="swatch" style="background: var(--head)"></span> Snake head</div>
        <div><span class="swatch" style="background: var(--snake)"></span> Snake body</div>
        <div><span class="swatch" style="background: #fff1f1; border-color: var(--food)"></span> Food</div>
      </div>

      <p id="state-summary" style="margin-top: 18px;"></p>
    </aside>
  </main>

  <script>
    const size = 10;
    const targetScore = 2;
    const foodSequence = [
      { row: 5, col: 6 },
      { row: 5, col: 8 },
      { row: 2, col: 3 },
      { row: 7, col: 3 },
      { row: 7, col: 8 }
    ];

    const board = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const movesEl = document.getElementById('moves');
    const statusEl = document.getElementById('status');
    const stateSummary = document.getElementById('state-summary');

    let snake;
    let direction;
    let score;
    let moves;
    let foodIndex;
    let food;
    let ended;

    function resetGame() {
      snake = [
        { row: 5, col: 4 },
        { row: 5, col: 3 },
        { row: 5, col: 2 }
      ];
      direction = 'right';
      score = 0;
      moves = 0;
      foodIndex = 0;
      food = { ...foodSequence[foodIndex] };
      ended = false;
      document.getElementById('target-score').textContent = String(targetScore);
      render(`Game reset. Reach score ${targetScore}.`);
    }

    function cellState(row, col) {
      if (snake[0].row === row && snake[0].col === col) return 'head';
      if (snake.some((segment, index) => index > 0 && segment.row === row && segment.col === col)) return 'snake';
      if (food.row === row && food.col === col) return 'food';
      return 'empty';
    }

    function render(message) {
      board.innerHTML = '';
      for (let row = 1; row <= size; row += 1) {
        for (let col = 1; col <= size; col += 1) {
          const state = cellState(row, col);
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'cell';
          cell.dataset.row = String(row);
          cell.dataset.col = String(col);
          cell.dataset.state = state;
          cell.setAttribute('role', 'gridcell');
          cell.setAttribute('aria-label', `Row ${row} column ${col}: ${state}`);
          cell.disabled = true;
          const label = document.createElement('span');
          label.className = 'sr-only';
          label.textContent = `Row ${row} column ${col}: ${state}`;
          cell.appendChild(label);
          board.appendChild(cell);
        }
      }

      const head = snake[0];
      scoreEl.textContent = String(score);
      movesEl.textContent = String(moves);
      statusEl.textContent = message;
      stateSummary.textContent = `Snake head is row ${head.row}, column ${head.col}. Food is row ${food.row}, column ${food.col}. Current direction is ${direction}.`;
      document.body.dataset.score = String(score);
      document.body.dataset.snakeHead = `${head.row},${head.col}`;
      document.body.dataset.food = `${food.row},${food.col}`;
      document.body.dataset.direction = direction;
      document.body.dataset.gameState = ended ? 'ended' : 'playing';
    }

    function placeNextFood() {
      foodIndex = (foodIndex + 1) % foodSequence.length;
      food = { ...foodSequence[foodIndex] };
      if (snake.some(segment => segment.row === food.row && segment.col === food.col)) {
        placeNextFood();
      }
    }

    function setDirection(nextDirection) {
      if (ended) return;
      direction = nextDirection;
      moveSnake();
    }

    function nextHead() {
      const head = snake[0];
      const next = { ...head };
      if (direction === 'up') next.row -= 1;
      if (direction === 'down') next.row += 1;
      if (direction === 'left') next.col -= 1;
      if (direction === 'right') next.col += 1;
      return next;
    }

    function moveSnake() {
      if (ended) return;
      const next = nextHead();
      moves += 1;

      if (next.row < 1 || next.row > size || next.col < 1 || next.col > size) {
        ended = true;
        render('Game over. The snake hit a wall. Press Reset game.');
        return;
      }

      const hitsSelf = snake.some(segment => segment.row === next.row && segment.col === next.col);
      if (hitsSelf) {
        ended = true;
        render('Game over. The snake hit itself. Press Reset game.');
        return;
      }

      snake.unshift(next);
      if (next.row === food.row && next.col === food.col) {
        score += 1;
        if (score >= targetScore) {
          ended = true;
          render(`Success. Score ${score} reached target ${targetScore}.`);
          return;
        }
        placeNextFood();
        render(`Food eaten. Score is ${score}. Next food is visible.`);
        return;
      }

      snake.pop();
      render(`Moved ${direction}. Keep going toward the food.`);
    }

    document.querySelectorAll('[data-direction]').forEach(button => {
      button.addEventListener('click', () => setDirection(button.dataset.direction));
    });

    document.getElementById('reset').addEventListener('click', resetGame);
    document.getElementById('new-food').addEventListener('click', () => {
      if (!ended) {
        placeNextFood();
        render('Food moved to the next test position.');
      }
    });

    document.addEventListener('keydown', event => {
      const keyMap = {
        ArrowUp: 'up',
        ArrowDown: 'down',
        ArrowLeft: 'left',
        ArrowRight: 'right'
      };
      if (keyMap[event.key]) {
        event.preventDefault();
        setDirection(keyMap[event.key]);
      }
    });

    resetGame();
  </script>
</body>
</html>
